name: ChatGPTUIDemo
options:
  bundleIdPrefix: org.example.skeleton
  deploymentTarget:
    iOS: '26.0'
packages:
  ChatGPTUI:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '0.1.0'
targets:
  ChatGPTUIDemo:
    type: application
    platform: iOS
    sources: [Demo]
    dependencies:
      - package: ChatGPTUI
        product: ChatGPTUI
      - package: ChatGPTUI
        product: ChatGPTWidgets
      - target: ChatGPTDemoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.skeleton.chatgpt
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chat UI Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Demo/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: org.example.skeleton.chatgpt.widget
            CFBundleURLSchemes: [chatgpt-ui-demo]
  ChatGPTDemoWidgets:
    type: app-extension
    platform: iOS
    sources: [WidgetDemo]
    dependencies:
      - package: ChatGPTUI
        product: ChatGPTWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.skeleton.chatgpt.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: WidgetDemo/Info.plist
      properties:
        CFBundleDisplayName: Chat UI Demo Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ChatGPTUIDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DemoUITests]
    dependencies:
      - target: ChatGPTUIDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChatGPTUIDemo
schemes:
  ChatGPTUIDemo:
    build:
      targets:
        ChatGPTUIDemo: all
    test:
      targets: [ChatGPTUIDemoUITests]
